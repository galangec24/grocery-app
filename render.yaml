services:
  - type: web
    name: grocery-price-finder-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    # Proxy headers give the rate limiter the real client IP. One worker keeps the
    # in-process limiter and price collection loop single-instance.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: grocery
      - key: CORS_ORIGINS
        value: https://grocery-app-71cfd.web.app,https://grocery-app-71cfd.firebaseapp.com
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@grocery-app.ph
      - key: ADMIN_PASSWORD
        generateValue: true
