services:
  - type: web
    name: grocery-price-finder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Proxy headers give the rate limiter the real client IP. One worker keeps the
    # in-process limiter and demo feed loop single-instance.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: grocery
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Replaces the well-known local password on every deployed instance.
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEMO_MODE
        value: "true"
