name: grocery_price_finder
description: Official Philippine grocery prices, multi-item search and shopping drafts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  flutter_secure_storage: ^9.2.0
  geolocator: ^13.0.0
  http: ^1.2.0
  image_picker: ^1.1.0
  latlong2: ^0.9.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  min_sdk_android: 24
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#0C2F1B"
  adaptive_icon_foreground: assets/icon_foreground.png
  remove_alpha_ios: true
