name: Release APK

# Push a tag like v1.2.0 and the signed APK is published as a GitHub Release.
# The app reads the newest release to show "Update available" and "What's new".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  API_URL: https://grocery-price-finder-api.onrender.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD. Without the same key, phones refuse the update."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare and test
        working-directory: mobile
        run: |
          bash ci/prepare.sh android
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build
        working-directory: mobile
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$version" --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_URL=${{ env.API_URL }}
      - name: Sign
        working-directory: mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:PASSWORD --key-pass env:PASSWORD \
            --out "$RUNNER_TEMP/grocery-price-finder.apk" build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify "$RUNNER_TEMP/grocery-price-finder.apk"
          rm "$RUNNER_TEMP/release.p12"
      - name: Write release notes
        run: |
          message="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d')"
          subject="$(git log -1 --format=%s "$GITHUB_REF_NAME")"
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$message" ] && [ "$message" != "$subject" ]; then
            printf '%s\n' "$message" > notes.md
          elif [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME" > notes.md
          else
            echo "First release." > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: ${{ runner.temp }}/grocery-price-finder.apk
          fail_on_unmatched_files: true
