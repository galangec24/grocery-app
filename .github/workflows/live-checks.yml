name: Live price checks

# Every hour. This also wakes the free Render service, and the Price Agent runs
# as soon as it starts, so prices stay current even when nobody has the app open.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest httpx
      - name: Wake the backend
        run: curl -s --retry 8 --retry-delay 15 --retry-all-errors -m 90 https://grocery-price-finder-api.onrender.com/api/v1/health
      - run: pytest -q live_tests -p no:cacheprovider
